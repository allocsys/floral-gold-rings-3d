<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floral Gold Rings – 3D viewer</title>
<style>
  :root{--bg:#f4f1ea;--fg:#1d1b16;--panel:rgba(255,255,255,.88);--accent:#b8860b}
  @media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f1ece0;--panel:rgba(30,27,20,.88)}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:var(--panel);backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;box-sizing:border-box}
  @media(min-width:720px){#ui{left:auto;top:0;right:0;bottom:0;width:320px;max-height:none;border-radius:0}}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs button{flex:1 1 56px}
  .tabs button,.act button{flex:1;padding:8px 4px;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  .tabs button.on{background:var(--accent);color:#fff}
  .row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
  .row output{text-align:right;font-variant-numeric:tabular-nums}
  .act{display:flex;gap:6px;margin-top:10px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #info{opacity:.7;font-size:12px;margin-top:6px}
  .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .hd .tabs{flex:1;margin:0}
  #tog{flex:0 0 auto;width:38px;padding:8px 0;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  #ui.collapsed{overflow:hidden}
  #ui.collapsed .hd{margin-bottom:0}
  #ui.collapsed #body{display:none}
  @media(min-width:720px){#ui.collapsed{bottom:auto;border-radius:0 0 0 16px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hd"><div class="tabs" id="tabs"></div><button id="tog" aria-label="Toggle settings" aria-expanded="true">▾</button></div>
  <div id="body">
    <div id="sliders"></div>
    <div class="act"><button id="reset">Reset</button><button id="spin">Spin: off</button></div>
    <div id="info"></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { DEFAULTS, LABELS, CONTROLS } from './geometry.js?v=clean1';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.6;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0x4a3b30); // warm brown, like the reference box
const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.position.set(-10, 20, 14); scene.add(key);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
camera.position.set(6, 16, 34);
const controls = new OrbitControls(camera, canvas);
controls.enableRotate = false; controls.enableDamping = true; controls.screenSpacePanning = true; // D-ctl: OrbitControls only zooms/pans; rotation = free trackball on the ring (no pole clamp)
let spinOn = false, dragging = false, vel = new THREE.Vector2(), HOME = camera.position.clone();
const ptrs = new Map(), _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
function rotView(dx, dy) { // screen-space drag -> rotate ring about camera up/right axes (any direction, no roll lock)
  const a = Math.hypot(dx, dy); if (a < 1e-6) return;
  _ax.set(dy, dx, 0).normalize().applyQuaternion(camera.quaternion);
  group.quaternion.premultiply(_q.setFromAxisAngle(_ax, a * 0.008));
}
canvas.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, e); if (ptrs.size === 1 && e.button === 0) { dragging = true; vel.set(0, 0); canvas.setPointerCapture(e.pointerId); } else dragging = false; });
canvas.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.clientX, dy = e.clientY - p.clientY; ptrs.set(e.pointerId, e); if (dragging && ptrs.size === 1) { rotView(dx, dy); vel.set(dx, dy); } });
const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) dragging = false; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('dblclick', () => { camera.position.copy(HOME); controls.target.set(0, 0, 0); group.quaternion.identity(); vel.set(0, 0); });
const group = new THREE.Group(); scene.add(group);

// D80 (Meshy): band tabs use the Meshy image-to-3D strip (site/band_meshy_tile.glb = one seamless repeat cut from the Meshy strip at matched columns, flat slab x=length y=width z=relief) bent into a ring.
const MR_ON = new URLSearchParams(location.search).get('mr') !== '0';
let meshySrc = null, meshyFail = false;
const isMeshy = () => !meshyFail && (kind === 'band1' || kind === 'band2');
let bandStarted = false; // lazy: each GLB is fetched only when its tab is first opened (startup was ~82 MB for all three)
const loadBand = () => { if (bandStarted) return; bandStarted = true; new GLTFLoader().load('band_meshy_tile.glb', g => {
  let m = null; g.scene.traverse(o => { if (o.isMesh && !m) m = o; });
  if (!m.geometry.attributes.normal) m.geometry.computeVertexNormals();
  m.geometry.computeBoundingBox();
  const mrm = m.material.metalnessMap; // original Meshy metal/roughness map (G = roughness, B = metal); ?mr=0 = flat metalness .85 / roughness .4 as before
  const mat = new THREE.MeshStandardMaterial({ map: m.material.map, normalMap: m.material.normalMap, color: 0xffffff, ...(MR_ON && mrm ? { metalnessMap: mrm, roughnessMap: mrm, metalness: 1, roughness: 1 } : { metalness: 0.85, roughness: 0.4 }) });
  if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
  // inside of the ring: faces whose 3 vertex normals all point straight back or straight sideways (the strip's inside and its two flat edges) get a plain polished-gold material (the Meshy texture there is baked rough relief); ?bore=0 = textured as before
  const BORE_ON = new URLSearchParams(location.search).get('bore') !== '0';
  const bore = new THREE.MeshStandardMaterial({ color: 0xe9b73f, metalness: 1, roughness: 0.24 });
  const geo = m.geometry, idx = geo.index.array, nz = geo.attributes.normal.array, A = [], B = [];
  for (let i = 0; i < idx.length; i += 3) { const flat = k => nz[idx[i + k] * 3 + 2] < -0.97 || Math.abs(nz[idx[i + k] * 3 + 1]) > 0.97; const isB = BORE_ON && flat(0) && flat(1) && flat(2); (isB ? B : A).push(idx[i], idx[i + 1], idx[i + 2]); }
  geo.setIndex([...A, ...B]); geo.clearGroups(); geo.addGroup(0, A.length, 0); if (B.length) geo.addGroup(A.length, B.length, 1);
  meshySrc = { geo, mat, mats: [mat, bore], b: geo.boundingBox };
  if (isMeshy()) queue('fine');
}, undefined, e => { console.error('meshy glb failed', e); meshyFail = true; queue('fine'); }); };
const meshyW = { band1: null, band2: null }, meshyLastW = { band1: 4.6, band2: 4.6 }, meshyT = { band1: null, band2: null }, meshyLastT = { band1: 1.5, band2: 1.5 }; // user-chosen width / thickness in mm per band tab; null = auto (natural value of the best-fit repeat count, as before the sliders existed)
function buildMeshy(ID, wt, tt) { // wrap the slab: x -> angle (N tiles round the ring), y -> ring axis, z -> radius; scale k (x, z) so the N tiles close exactly round the ring; wt = target width in mm (null = auto): N = repeat count whose natural width k*W is nearest wt, then only the ring-axis scale is stretched to hit wt exactly; tt = target thickness in mm (null = auto = natural k*dz): only the radial (relief-depth) scale changes
  const { geo, b } = meshySrc, L = b.max.x - b.min.x, W = b.max.y - b.min.y, dz = b.max.z - b.min.z, Ri = ID / 2, c = 0.7, T = Math.PI * 2;
  const kN = n => tt ? (T / n) * (Ri + c * tt) / L : (T * Ri / n) / (L - T * c * dz / n), tgt = wt || 4.5; // tile length k*L = arc at radius Ri + c*(relief height): with a fixed thickness tt that height is tt, otherwise k*dz
  let N = 2; for (let n = 3; n <= 12; n++) if (Math.abs(Math.log(kN(n) * W / tgt)) < Math.abs(Math.log(kN(N) * W / tgt))) N = n;
  const k = kN(N), ky = wt ? wt / W : k, kz = tt ? tt / dz : k, P = geo.attributes.position, Nr = geo.attributes.normal, meshes = [];
  for (let t = 0; t < N; t++) {
    const g = geo.clone(), pa = g.attributes.position.array, na = g.attributes.normal.array;
    for (let i = 0; i < P.count; i++) {
      const th = (((P.getX(i) - b.min.x) / L) + t) / N * T, r = Ri + (P.getZ(i) - b.min.z) * kz, ct = Math.cos(th), st = Math.sin(th);
      pa[i * 3] = r * ct; pa[i * 3 + 1] = r * st; pa[i * 3 + 2] = (P.getY(i) - (b.min.y + b.max.y) / 2) * ky;
      const nx = Nr.getX(i), nz = Nr.getZ(i) * (k / kz), ny = Nr.getY(i) * (k / ky), l = Math.hypot(nx, ny, nz) || 1; // axis stretch ky/k and radial stretch kz/k: the normal's components scale by k/ky and k/kz (inverse-transpose), then renormalise
      na[i * 3] = (nz * ct - nx * st) / l; na[i * 3 + 1] = (nz * st + nx * ct) / l; na[i * 3 + 2] = ny / l; // (theta, axis, radial) -> world
    }
    g.attributes.position.needsUpdate = true; g.attributes.normal.needsUpdate = true; g.computeBoundingSphere();
    meshes.push(new THREE.Mesh(g, meshySrc.mats));
  }
  return { meshes, N, w: ky * W, t: kz * dz, stretch: ky / k };
}

// Solitaire (D81): Meshy GLB (reference/meshy/solitaire_5.glb, copied to site/solitaire_meshy2.glb; the first Solitaire was solitaire_3.glb), used as is with its own textures. Scaled so the bore (circle fitted to the model: centre (SOL_CX, SOL_CY), radius SOL_R in model units) has the chosen inner diameter, and re-centred on the origin. Ring axis = z, stone at +y. The old parametric solitaire is gone (last in commit 3597c30).
const SOLS = { solitaire: { file: 'solitaire_meshy2.glb', cx: -0.0001, cy: -0.1190, r: 0.7256, label: 'Solitaire' }, solitaire2: { file: 'solitaire_6.glb', cx: -0.0004, cy: -0.0739, r: 0.7366, label: 'Solitaire 2', stone: 'solitaire_6_stone.bin' } };
const glbP = {}, loadGLB = f => glbP[f] || (glbP[f] = new Promise((res, rej) => new GLTFLoader().load(f, res, undefined, rej)));
// Gem (Solitaire 2): site/solitaire_6_stone.bin = bitmask of the stone triangles (tools/meshy/make_stone_mask.py, from the blue-white patch of the base colour texture). They get their own gem material (no baked texture); ?gem=0 = old baked look, ?gem=b = transmissive variant.
const GEM = new URLSearchParams(location.search).get('gem') ?? 'e', BORE_ON = new URLSearchParams(location.search).get('bore') !== '0', boreMat = () => new THREE.MeshStandardMaterial({ color: 0xe9b73f, metalness: 1, roughness: 0.24 });
function gemMat(m, v) { const o = { a: {}, b: { transmission: 1, thickness: 0.5 }, c: { color: 0x14181e, clearcoat: 0, envMapIntensity: 1.6 }, d: { color: 0xe6edf8, metalness: 1, roughness: 0.07, clearcoat: 0, envMapIntensity: 1.2 }, e: { color: 0xf2f6ff, metalness: 1, roughness: 0.04, clearcoat: 0, envMapIntensity: 1.5, normalMap: null }, f: { color: 0x14181e, clearcoat: 0, envMapIntensity: 1.6, normalMap: null } }[v] || {}; return new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.03, ior: 2.4, specularIntensity: 1, envMapIntensity: 2, clearcoat: 1, clearcoatRoughness: 0, normalMap: m.material.normalMap, side: THREE.DoubleSide, ...o }); }
const loadSol = key => { const S = SOLS[key]; if (S.started) return; S.started = true;
  S.done = loadGLB(S.file).then(async g => {
  let m = null; g.scene.traverse(o => { if (o.isMesh && !m) m = o; });
  S.src = { geo: m.geometry, mat: m.material };
  // triangle classes: 0 gold (textured), 1 gem (stone mask, Solitaire 2), 2 bore = all 3 verts within 4% of the bore radius with the normal pointing at the axis (dot < -0.9; 8.8k / 16.3k tris, full 360 deg, measured); bore gets plain polished gold like the bands, ?bore=0 = textured as before
  const geo = m.geometry, idx = geo.index.array, pos = geo.attributes.position.array, nor = geo.attributes.normal.array, n = idx.length / 3, cls = new Uint8Array(n);
  const mk = S.stone && GEM !== '0' ? new Uint8Array(await (await fetch(S.stone)).arrayBuffer()) : null;
  const inB = v => { const dx = pos[3 * v] - S.cx, dy = pos[3 * v + 1] - S.cy, rr = Math.hypot(dx, dy); return Math.abs(rr / S.r - 1) < 0.04 && (nor[3 * v] * dx + nor[3 * v + 1] * dy) / rr < -0.9; };
  for (let t = 0; t < n; t++) cls[t] = mk && (mk[t >> 3] >> (t & 7)) & 1 ? 1 : BORE_ON && inB(idx[3 * t]) && inB(idx[3 * t + 1]) && inB(idx[3 * t + 2]) ? 2 : 0;
  if (mk || BORE_ON) {
    const out = new idx.constructor(idx.length), mats = [m.material, mk ? gemMat(m, GEM) : null, BORE_ON ? boreMat() : null]; let o = 0; geo.clearGroups();
    for (let c = 0; c < 3; c++) { const o0 = o; for (let t = 0; t < n; t++) if (cls[t] === c) { out.set(idx.subarray(3 * t, 3 * t + 3), o); o += 3; } if (o > o0) geo.addGroup(o0, o - o0, c); }
    geo.setIndex(new THREE.BufferAttribute(out, 1)); S.src.mat = mats.map(x => x || m.material);
    console.log(key, 'tris gold/gem/bore', [0, 1, 2].map(c => cls.reduce((a, v) => a + (v === c), 0)).join('/'));
  }
  if (kind === key) queue('fine');
}).catch(e => { console.error(key + ' glb failed', e); S.fail = true; queue('fine'); }); };
function buildSol(key, ID) { const S = SOLS[key], k = (ID / 2) / S.r, mesh = new THREE.Mesh(S.src.geo, S.src.mat); mesh.scale.setScalar(k); mesh.position.set(-S.cx * k, -S.cy * k, 0); mesh.userData.shared = true; return mesh; }

let kind = 'solitaire';
const state = Object.fromEntries(Object.entries(DEFAULTS).map(([k, v]) => [k, { ...v }]));
let dirty = 'fine', fineTimer = 0;
const queue = (q) => { dirty = q; };

function rebuild(quality) {
  for (const m of [...group.children]) { if (!m.userData.shared) m.geometry.dispose(); if (m.material.userData?.nm) m.material.dispose(); group.remove(m); }
  if (SOLS[kind]) {
    const S = SOLS[kind]; scene.background.set(0x4a3b30);
    if (S.fail) { document.getElementById('info').textContent = S.label + ' model failed to load'; return; }
    if (!S.src) { document.getElementById('info').textContent = 'loading ' + S.label.toLowerCase() + '…'; return; }
    group.add(buildSol(kind, state[kind].ID));
    document.getElementById('info').textContent = `${S.label} (Meshy) · Ø ${state[kind].ID} mm inner`; return;
  }
  if (isMeshy()) {
    scene.background.set(0x4a3b30);
    if (!meshySrc) { document.getElementById('info').textContent = 'loading Meshy band…'; return; }
    const r = buildMeshy(state[kind].ID, meshyW[kind], meshyT[kind]); for (const m of r.meshes) group.add(m);
    meshyLastW[kind] = r.w; meshyLastT[kind] = r.t;
    for (const [key, user, val] of [['w', meshyW, r.w], ['t', meshyT, r.t]]) if (user[kind] == null) { const si = sliders.querySelector(`input[data-k="${key}"]`); if (si) { si.value = val.toFixed(key === 'w' ? 1 : 2); si.nextElementSibling.textContent = si.value; } } // auto: the slider follows the natural value (e.g. when the diameter changes)
    document.getElementById('info').textContent = `Meshy band · Ø ${state[kind].ID} mm inner · ${r.N} repeats · ${r.w.toFixed(1)} mm wide${Math.abs(r.stretch - 1) > 0.005 ? ` (${r.stretch > 1 ? 'stretched' : 'squeezed'} ${Math.round(Math.abs(r.stretch - 1) * 100)}% across)` : ''} · ${r.t.toFixed(1)} mm thick`; return;
  }
  scene.background.set(0x4a3b30); document.getElementById('info').textContent = 'Meshy band failed to load';
}

const tabs = document.getElementById('tabs'), sliders = document.getElementById('sliders');
function renderUI() {
  if (SOLS[kind]) loadSol(kind); else if (kind === 'band1' || kind === 'band2') loadBand(); // lazy GLB load on first visit of the tab
  tabs.innerHTML = ''; sliders.innerHTML = '';
  for (const k of Object.keys(DEFAULTS)) {
    const b = document.createElement('button'); b.textContent = LABELS[k]; b.className = k === kind ? 'on' : '';
    b.onclick = () => { kind = k; spin.textContent = 'Spin: ' + (spinOn ? 'on' : 'off'); renderUI(); queue('fine'); }; tabs.appendChild(b);
  }
  for (const [key, label, min, max, step, only] of CONTROLS) {
    if (only && ![].concat(only).includes(kind)) continue;
    if (SOLS[kind] && key !== 'ID') continue;
    if (isMeshy() && key !== 'ID' && key !== 'w' && key !== 't') continue;
    const mw = isMeshy() && (key === 'w' || key === 't'), mu = key === 'w' ? meshyW : meshyT, lo = mw && key === 'w' ? 3 : min, hi = mw && key === 'w' ? 7 : max, val = mw ? Math.min(hi, Math.max(lo, mu[kind] ?? (key === 'w' ? meshyLastW : meshyLastT)[kind])).toFixed(key === 'w' ? 1 : 2) : state[kind][key]; // Meshy band: width 3-7 mm (repeat count chosen to fit, only the ring-axis scale stretches), thickness 0.8-3 mm (only the radial relief scale changes)
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label>${label}</label><input type="range" data-k="${key}" min="${lo}" max="${hi}" step="${step}" value="${val}"><output>${val}</output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.oninput = () => { state[kind][key] = +inp.value; if (mw) mu[kind] = +inp.value; out.textContent = inp.value; queue('draft'); clearTimeout(fineTimer); fineTimer = setTimeout(() => queue('fine'), 350); };
    sliders.appendChild(row);
  }
}
document.getElementById('reset').onclick = () => { state[kind] = { ...DEFAULTS[kind] }; if (kind in meshyW) { meshyW[kind] = null; meshyT[kind] = null; } renderUI(); queue('fine'); };
const spin = document.getElementById('spin');
spin.onclick = () => { spinOn = !spinOn; spin.textContent = 'Spin: ' + (spinOn ? 'on' : 'off'); };
const ui = document.getElementById('ui'), tog = document.getElementById('tog');
function setCollapsed(c) { ui.classList.toggle('collapsed', c); tog.textContent = c ? '▴' : '▾'; tog.setAttribute('aria-expanded', String(!c)); }
tog.onclick = () => setCollapsed(!ui.classList.contains('collapsed'));
setCollapsed(innerWidth < 720); // start collapsed on phones so the ring is fully visible
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); renderUI();
renderer.setAnimationLoop(() => { if (dirty) { const q = dirty; dirty = false; rebuild(q); } if (!dragging) { if (vel.lengthSq() > 0.01) { rotView(vel.x, vel.y); vel.multiplyScalar(0.94); } else if (spinOn && !ptrs.size) group.rotateY(0.004); } controls.update(); renderer.render(scene, camera); });
</script>
</body></html>
