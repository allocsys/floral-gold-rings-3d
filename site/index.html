<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floral Gold Rings – 3D viewer</title>
<style>
  :root{--bg:#f4f1ea;--fg:#1d1b16;--panel:rgba(255,255,255,.88);--accent:#b8860b}
  @media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f1ece0;--panel:rgba(30,27,20,.88)}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:var(--panel);backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;box-sizing:border-box}
  @media(min-width:720px){#ui{left:auto;top:0;right:0;bottom:0;width:320px;max-height:none;border-radius:0}}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button,.act button{flex:1;padding:8px 4px;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  .tabs button.on{background:var(--accent);color:#fff}
  .row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
  .row output{text-align:right;font-variant-numeric:tabular-nums}
  .act{display:flex;gap:6px;margin-top:10px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #info{opacity:.7;font-size:12px;margin-top:6px}
  .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .hd .tabs{flex:1;margin:0}
  #tog{flex:0 0 auto;width:38px;padding:8px 0;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  #ui.collapsed{overflow:hidden}
  #ui.collapsed .hd{margin-bottom:0}
  #ui.collapsed #body{display:none}
  @media(min-width:720px){#ui.collapsed{bottom:auto;border-radius:0 0 0 16px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hd"><div class="tabs" id="tabs"></div><button id="tog" aria-label="Toggle settings" aria-expanded="true">▾</button></div>
  <div id="body">
    <div id="sliders"></div>
    <div class="act"><button id="reset">Reset</button><button id="spin">Spin: off</button><button id="dl">Download STL</button></div>
    <div id="info"></div>
  </div>
</div>

    g.computeVertexNormals();
    if (s.col && s.grid && quality === 'ultra') { // D33: [1 2 1] passes of the vertex normals: 1 along grid i (ring), PV along grid j (across the band; v slope noise is ~2x u in smooth gold, meshq)
      const [N, M] = s.grid, nA = g.attributes.normal.array, nB = new Float32Array(nA.length), PV = 3;
      for (let pass = 0; pass < PV; pass++) {
        const di1 = pass === 0 ? 1 : 0;
        for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
          let x = 0, y = 0, z = 0;
          for (let di = -di1; di <= di1; di++) for (let dj = -1; dj <= 1; dj++) {
            const jj = j + dj; if (jj < 0 || jj >= M) continue;
            const w = (di ? 1 : 2) * (dj ? 1 : 2), o = (((i + di + N) % N) * M + jj) * 3; x += w * nA[o]; y += w * nA[o + 1]; z += w * nA[o + 2];
          }
          const l = Math.hypot(x, y, z) || 1, o = (i * M + j) * 3; nB[o] = x / l; nB[o + 1] = y / l; nB[o + 2] = z / l;
        }
        nA.set(nB);
      }
    }
    group.add(new THREE.Mesh(g, kind === 'solitaire3' ? (s.kind === 'gem' ? gem3 : polished) : s.col ? (kind === 'band1' || kind === 'band2' ? plq : NM && s.nm && quality !== 'draft' ? makeNM(s) : goldVC) : gold));
  }
  const p = state[kind];
  document.getElementById('info').textContent = `Ø ${p.ID} mm inner · ${quality === 'draft' ? 'draft preview while dragging' : quality === 'ultra' ? 'ultra detail' : 'full detail'} · mm`;
}

const tabs = document.getElementById('tabs'), sliders = document.getElementById('sliders');
function renderUI() {
  tabs.innerHTML = ''; sliders.innerHTML = '';
  for (const k of Object.keys(DEFAULTS)) {
    const b = document.createElement('button'); b.textContent = LABELS[k]; b.className = k === kind ? 'on' : '';
    b.onclick = () => { kind = k; spin.textContent = 'Spin: ' + (spinOn ? 'on' : 'off'); renderUI(); queue('fine'); }; tabs.appendChild(b);
  }
  document.getElementById('dl').style.display = isMeshy() || SOLS[kind] || kind === 'solitaire3' ? 'none' : '';
  for (const [key, label, min, max, step, only] of CONTROLS) {
    if (only && ![].concat(only).includes(kind)) continue;
    if ((SOLS[kind] || kind === 'solitaire3') && key !== 'ID') continue;
    if (isMeshy() && key !== 'ID' && key !== 'w' && key !== 't') continue;
    const mw = isMeshy() && (key === 'w' || key === 't'), mu = key === 'w' ? meshyW : meshyT, lo = mw && key === 'w' ? 3 : min, hi = mw && key === 'w' ? 7 : max, val = mw ? Math.min(hi, Math.max(lo, mu[kind] ?? (key === 'w' ? meshyLastW : meshyLastT)[kind])).toFixed(key === 'w' ? 1 : 2) : state[kind][key]; // Meshy band: width 3-7 mm (repeat count chosen to fit, only the ring-axis scale stretches), thickness 0.8-3 mm (only the radial relief scale changes)
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label>${label}</label><input type="range" data-k="${key}" min="${lo}" max="${hi}" step="${step}" value="${val}"><output>${val}</output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.oninput = () => { state[kind][key] = +inp.value; if (mw) mu[kind] = +inp.value; out.textContent = inp.value; queue('draft'); clearTimeout(fineTimer); fineTimer = setTimeout(() => queue('fine'), 350); };
    sliders.appendChild(row);
  }
}
document.getElementById('reset').onclick = () => { state[kind] = { ...DEFAULTS[kind] }; if (kind in meshyW) { meshyW[kind] = null; meshyT[kind] = null; } renderUI(); queue('fine'); };
const spin = document.getElementById('spin');
spin.onclick = () => { spinOn = !spinOn; spin.textContent = 'Spin: ' + (spinOn ? 'on' : 'off'); };
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toSTL(buildRing(kind, state[kind], 'fine'))], { type: 'model/stl' }));
  a.download = `ring_${kind}.stl`; a.click(); URL.revokeObjectURL(a.href);
};
const ui = document.getElementById('ui'), tog = document.getElementById('tog');
function setCollapsed(c) { ui.classList.toggle('collapsed', c); tog.textContent = c ? '▴' : '▾'; tog.setAttribute('aria-expanded', String(!c)); }
tog.onclick = () => setCollapsed(!ui.classList.contains('collapsed'));
setCollapsed(innerWidth < 720); // start collapsed on phones so the ring is fully visible
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); renderUI();
// relief bands refine to 'ultra' (.02 mm step) once the view has been idle for 700 ms
renderer.setAnimationLoop(() => { if (dirty) { const q = dirty; dirty = false; rebuild(q); if (q === 'fine' && (ULTRA_OK || MID_OK)) ultraTimer = setTimeout(() => queue('ultra'), 700); } if (!dragging) { if (vel.lengthSq() > 0.01) { rotView(vel.x, vel.y); vel.multiplyScalar(0.94); } else if (spinOn && !ptrs.size) group.rotateY(0.004); } controls.update(); renderer.render(scene, camera); });
</script>
