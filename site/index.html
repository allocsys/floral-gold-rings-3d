<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floral Gold Rings – 3D viewer</title>
<style>
  :root{--bg:#f4f1ea;--fg:#1d1b16;--panel:rgba(255,255,255,.88);--accent:#b8860b}
  @media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f1ece0;--panel:rgba(30,27,20,.88)}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:var(--panel);backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;box-sizing:border-box}
  @media(min-width:720px){#ui{left:auto;top:0;right:0;bottom:0;width:320px;max-height:none;border-radius:0}}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button,.act button{flex:1;padding:8px 4px;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  .tabs button.on{background:var(--accent);color:#fff}
  .row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
  .row output{text-align:right;font-variant-numeric:tabular-nums}
  .act{display:flex;gap:6px;margin-top:10px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #info{opacity:.7;font-size:12px;margin-top:6px}
  .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .hd .tabs{flex:1;margin:0}
  #tog{flex:0 0 auto;width:38px;padding:8px 0;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  #ui.collapsed{overflow:hidden}
  #ui.collapsed .hd{margin-bottom:0}
  #ui.collapsed #body{display:none}
  @media(min-width:720px){#ui.collapsed{bottom:auto;border-radius:0 0 0 16px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hd"><div class="tabs" id="tabs"></div><button id="tog" aria-label="Toggle settings" aria-expanded="true">▾</button></div>
  <div id="body">
    <div id="sliders"></div>
    <div class="act"><button id="reset">Reset</button><button id="spin">Spin: on</button><button id="dl">Download STL</button></div>
    <div id="info"></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { DEFAULTS, LABELS, CONTROLS, buildRing, toSTL } from './geometry.js?v=relief4';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0x4a3b30); // warm brown, like the reference box
const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.position.set(-10, 20, 14); scene.add(key);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
camera.position.set(6, 16, 34);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.5;
const gold = new THREE.MeshStandardMaterial({ color: 0xe6b84a, metalness: 1, roughness: 0.28 });
const gem = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0, transmission: 1, thickness: 3, ior: 2.4, specularIntensity: 1, envMapIntensity: 3.5, side: THREE.DoubleSide, attenuationColor: 0xf2f6ff, attenuationDistance: 12 });
const group = new THREE.Group(); scene.add(group);

let kind = 'solitaire';
const state = Object.fromEntries(Object.entries(DEFAULTS).map(([k, v]) => [k, { ...v }]));
let shells = [], dirty = 'fine', fineTimer = 0;
const queue = (q) => { dirty = q; };

function rebuild(quality) {
  for (const m of [...group.children]) { m.geometry.dispose(); group.remove(m); }
  shells = buildRing(kind, state[kind], quality);
  for (const s of shells) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(s.pos, 3));
    g.setIndex(new THREE.BufferAttribute(s.idx, 1));
    g.computeVertexNormals();
    group.add(new THREE.Mesh(g, s.kind === 'stone' ? gem : gold));
  }
  const p = state[kind];
  document.getElementById('info').textContent = `Ø ${p.ID} mm inner · ${quality === 'draft' ? 'draft preview while dragging' : 'full detail'} · mm`;
}

const tabs = document.getElementById('tabs'), sliders = document.getElementById('sliders');
function renderUI() {
  tabs.innerHTML = ''; sliders.innerHTML = '';
  for (const k of Object.keys(DEFAULTS)) {
    const b = document.createElement('button'); b.textContent = LABELS[k]; b.className = k === kind ? 'on' : '';
    b.onclick = () => { kind = k; renderUI(); queue('fine'); }; tabs.appendChild(b);
  }
  for (const [key, label, min, max, step, only] of CONTROLS) {
    if (only && ![].concat(only).includes(kind)) continue;
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${state[kind][key]}"><output>${state[kind][key]}</output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.oninput = () => { state[kind][key] = +inp.value; out.textContent = inp.value; queue('draft'); clearTimeout(fineTimer); fineTimer = setTimeout(() => queue('fine'), 350); };
    sliders.appendChild(row);
  }
}
document.getElementById('reset').onclick = () => { state[kind] = { ...DEFAULTS[kind] }; renderUI(); queue('fine'); };
const spin = document.getElementById('spin');
spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.textContent = 'Spin: ' + (controls.autoRotate ? 'on' : 'off'); };
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toSTL(buildRing(kind, state[kind], 'fine'))], { type: 'model/stl' }));
  a.download = `ring_${kind}.stl`; a.click(); URL.revokeObjectURL(a.href);
};
const ui = document.getElementById('ui'), tog = document.getElementById('tog');
function setCollapsed(c) { ui.classList.toggle('collapsed', c); tog.textContent = c ? '▴' : '▾'; tog.setAttribute('aria-expanded', String(!c)); }
tog.onclick = () => setCollapsed(!ui.classList.contains('collapsed'));
setCollapsed(innerWidth < 720); // start collapsed on phones so the ring is fully visible
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); renderUI();
renderer.setAnimationLoop(() => { if (dirty) { const q = dirty; dirty = false; rebuild(q); } controls.update(); renderer.render(scene, camera); });
</script>
</body></html>
