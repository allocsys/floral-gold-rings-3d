<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floral Gold Rings – 3D viewer</title>
<style>
  :root{--bg:#f4f1ea;--fg:#1d1b16;--panel:rgba(255,255,255,.88);--accent:#b8860b}
  @media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#f1ece0;--panel:rgba(30,27,20,.88)}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:var(--panel);backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;box-sizing:border-box}
  @media(min-width:720px){#ui{left:auto;top:0;right:0;bottom:0;width:320px;max-height:none;border-radius:0}}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button,.act button{flex:1;padding:8px 4px;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  .tabs button.on{background:var(--accent);color:#fff}
  .row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
  .row output{text-align:right;font-variant-numeric:tabular-nums}
  .act{display:flex;gap:6px;margin-top:10px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #info{opacity:.7;font-size:12px;margin-top:6px}
  .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .hd .tabs{flex:1;margin:0}
  #tog{flex:0 0 auto;width:38px;padding:8px 0;border:1px solid var(--accent);background:transparent;color:var(--fg);border-radius:8px;font:inherit}
  #ui.collapsed{overflow:hidden}
  #ui.collapsed .hd{margin-bottom:0}
  #ui.collapsed #body{display:none}
  @media(min-width:720px){#ui.collapsed{bottom:auto;border-radius:0 0 0 16px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hd"><div class="tabs" id="tabs"></div><button id="tog" aria-label="Toggle settings" aria-expanded="true">▾</button></div>
  <div id="body">

    <div class="act"><button id="reset">Reset</button><button id="spin">Spin: off</button><button id="dl">Download STL</button></div>
    <div id="info"></div>
  </div>
</div>

  }

};
const ui = document.getElementById('ui'), tog = document.getElementById('tog');
